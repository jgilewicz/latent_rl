[project]
name = "latent-rl"
version = "0.1.0"
description = "Latent-space ablation for PPO on Crafter: IMPALA encoder vs JEPA vs VAE vs SAE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "crafter>=1.8.3",
    "gradio>=6.30.0",
    "gymnasium>=1.4.0",
    "matplotlib==3.11.2",
    "numba==0.68.0",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "rliable>=1.2.0",
    "scipy==1.18.1",
    "torch>=2.14.1",
    "wandb>=0.31.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["latent_rl*"]
