checkpoints:
  ppo: checkpoints/ppo/seed1/last.pt
  jepa: checkpoints/jepa/seed0/last.pt
  vae: checkpoints/vae/seed1/last.pt
  sae: checkpoints/sae/seed1/last.pt
min_env_steps: 5000000

device: cpu
seed: 0
# far from training seeds (seed * n_envs + i); same worlds for every policy
env_seed: 100000
n_envs: 8
n_steps: 1250
encode_batch: 512
out_dir: eval_buffer

# crafter has no biome label: dominant terrain among visible cells,
# grouped after crafter's worldgen branches (trees are <=20% of grassland)
biomes:
  grassland: [grass, tree]
  water: [water, sand]
  mountain: [stone, coal, iron, diamond]
  cave: [path, lava]
