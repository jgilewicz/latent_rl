env:
  n_envs: 8
  reward: true

trainer:
  device: cuda
  feature_dim: 256
  action_dim: 17
  hidden_dim: 256
  dropout: 0.0
  n_steps: 512
  n_iterations: 1221
  batch_size: 256
  epochs: 4
  lr: 0.0003
  gamma: 0.99
  lam: 0.95
  epsilon: 0.2
  vf_coef: 0.5
  ent_coef: 0.02
  ent_coef_final: 0.005
  ent_decay_steps: 5000000
  max_norm: 0.5
  checkpoint_dir: checkpoints/vae
  checkpoint_every: 50
  recon_coef: 1.0
  kl_coef: 0.001

wandb:
  entity: w1ndrunn3rr-wroc-aw-univeristy-of-science-and-technology
  project: latent_rl
