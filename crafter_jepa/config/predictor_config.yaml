checkpoint: checkpoints/jepa/seed0/last.pt
output_dir: checkpoints/jepa/seed0/predictor
seed: 0

env:
  n_envs: 8
  reward: true

model:
  feature_dim: 256
  action_dim: 17
  hidden_dim: 256

training:
  device: cuda
  n_steps: 256
  n_iterations: 100
  batch_size: 256
  epochs: 4
  lr: 0.0005
  latent_loss_coef: 1.0
  recon_loss_coef: 1.0
  pred_obs_loss_coef: 1.0
  save_every: 25

evaluation:
  visualize_every: 25
  visualize_horizon: 8
